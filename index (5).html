<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Form Sapa Menggunakan AJAX dan PHP</title>
  <style>
    * { box-sizing: border-box; }

    body {
      font-family: "Segoe UI", Arial, Helvetica, sans-serif;
      background: #eef1f4;
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .card {
      background: #ffffff;
      width: 100%;
      max-width: 420px;
      padding: 28px 30px 30px;
      border-radius: 14px;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.12);
    }

    h1 {
      font-size: 1.35rem;
      text-align: center;
      color: #333;
      margin: 0 0 24px;
    }

    label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      color: #444;
      margin-bottom: 6px;
    }

    input[type="text"] {
      width: 100%;
      padding: 9px 12px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 0.9rem;
      margin-bottom: 14px;
    }

    input[type="text"]:focus {
      outline: none;
      border-color: #007bff;
      box-shadow: 0 0 0 2px rgba(0, 123, 255, 0.2);
    }

    .tombol-wrap { text-align: center; }

    button {
      background: #007bff;
      color: #ffffff;
      border: none;
      border-radius: 6px;
      padding: 9px 22px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
    }

    button:hover { background: #0069d9; }

    h2 {
      font-size: 1.05rem;
      text-align: center;
      color: #222;
      margin: 20px 0 12px;
    }

    #respon {
      padding: 12px 14px;
      border-radius: 6px;
      font-size: 0.85rem;
      background: #f5f5f5;
      border: 1px solid #ddd;
      color: #333;
    }

    /* Respon error (mis. input kosong) */
    #respon.error {
      background: #ffe5e5;
      border-color: #f1aeb5;
      color: #b02a37;
    }

    /* Respon sukses */
    #respon.sukses {
      background: #e6f9ea;
      border-color: #a3d9b1;
      color: #1e7e34;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Form Sapa Menggunakan AJAX dan PHP</h1>

    <form id="form-sapa">
      <label for="nama">Masukkan Nama Anda:</label>
      <input type="text" id="nama" name="nama" placeholder="Contoh: Alex" autocomplete="off">
      <div class="tombol-wrap">
        <button type="submit">Kirim</button>
      </div>
    </form>

    <h2>Respon Server:</h2>
    <div id="respon">Menunggu input...</div>
  </div>

  <script>
    const form = document.getElementById('form-sapa');
    const inputNama = document.getElementById('nama');
    const responDiv = document.getElementById('respon');

    // textContent dipakai agar respon tidak dieksekusi sebagai HTML
    function tampilkan(teks, kelas) {
      responDiv.textContent = teks;
      responDiv.className = kelas;
    }

    form.addEventListener('submit', async function (event) {
      // Cegah form melakukan reload halaman
      event.preventDefault();

      const data = new URLSearchParams();
      data.append('nama', inputNama.value);

      try {
        // Kirim permintaan AJAX (POST) ke server.php
        const response = await fetch('server.php', {
          method: 'POST',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
          body: data
        });
        const teks = await response.text();
        tampilkan(teks, response.ok ? 'sukses' : 'error');
      } catch (error) {
        if (location.protocol === 'file:') {
          // Halaman dibuka langsung dari folder, bukan lewat web server
          tampilkan('Halaman dibuka lewat file://. Buka lewat http://localhost/[nama folder]/index.html dengan Apache/Laragon menyala.', 'error');
        } else {
          tampilkan('Gagal menghubungi server.', 'error');
        }
      }
    });
  </script>
</body>
</html>
